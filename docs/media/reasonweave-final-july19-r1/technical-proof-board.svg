<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">ReasonWeave technical proof board</title>
  <desc id="description">A five-step learner reasoning trace from prediction through evidence judgment, design move, creation anchor, and reflection.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031827"/>
      <stop offset="0.52" stop-color="#07374a"/>
      <stop offset="1" stop-color="#052a35"/>
    </linearGradient>
    <linearGradient id="anchorFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4ed"/>
      <stop offset="1" stop-color="#f9ddd0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b7d8d4" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00101a" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7bc7c2"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1455" cy="45" r="250" fill="#db6d4d" opacity="0.08"/>
  <circle cx="85" cy="875" r="280" fill="#70c5bf" opacity="0.07"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="72" fill="#fbf8f1" font-family="Georgia, serif" font-size="46" font-weight="700">ReasonWeave</text>
    <rect x="70" y="89" width="82" height="5" rx="2.5" fill="#ec7650"/>

    <g transform="translate(875 38)">
      <rect width="350" height="48" rx="24" fill="#c7e3df"/>
      <text x="175" y="31" text-anchor="middle" fill="#075b64" font-size="16" font-weight="800" letter-spacing="1.1">OPENAI BUILD WEEK · EDUCATION</text>
    </g>
    <g transform="translate(1245 38)">
      <rect width="285" height="48" rx="24" fill="#fbf8f1"/>
      <text x="142.5" y="31" text-anchor="middle" fill="#a34127" font-size="16" font-weight="850" letter-spacing="0.8">SEEDED DEMO · LOCAL PROOF</text>
    </g>

    <text x="70" y="157" fill="#bde0dc" font-size="17" font-weight="750" letter-spacing="2.3">A VISIBLE EVIDENCE-TO-CREATION CHAIN</text>
    <text x="70" y="217" fill="#fbf8f1" font-family="Georgia, serif" font-size="50" font-weight="700">From a sourced finding to a learner-owned design.</text>
    <text x="70" y="255" fill="#a8cfcb" font-size="21">Pre-generated journey shown for reliability · no live-model or deployment claim</text>

    <path d="M190 291H1415" stroke="#7bc7c2" stroke-opacity="0.68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="190" cy="291" r="7" fill="#ec7650"/>

    <g filter="url(#shadow)">
      <rect x="70" y="323" width="280" height="264" rx="22" fill="#fbf8f1"/>
      <rect x="70" y="323" width="280" height="58" rx="22" fill="#d9eeea"/>
      <rect x="70" y="359" width="280" height="22" fill="#d9eeea"/>
      <text x="94" y="360" fill="#075b64" font-size="17" font-weight="850" letter-spacing="1.4">01 · PREDICT</text>
      <text x="94" y="417" fill="#102c3c" font-family="Georgia, serif" font-size="27" font-weight="700">Commit before</text>
      <text x="94" y="449" fill="#102c3c" font-family="Georgia, serif" font-size="27" font-weight="700">seeing evidence.</text>
      <path d="M94 476H326" stroke="#b8d6d2"/>
      <text x="94" y="507" fill="#526b75" font-size="18">A visible “before” state</text>
      <text x="94" y="533" fill="#526b75" font-size="18">protects learner judgment.</text>
      <rect x="94" y="551" width="112" height="23" rx="11.5" fill="#e8f4f2"/>
      <text x="150" y="568" text-anchor="middle" fill="#08747a" font-size="13" font-weight="800">LEARNER WORDS</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="362" y="323" width="280" height="264" rx="22" fill="#fbf8f1"/>
      <rect x="362" y="323" width="280" height="58" rx="22" fill="#d9eeea"/>
      <rect x="362" y="359" width="280" height="22" fill="#d9eeea"/>
      <text x="386" y="360" fill="#075b64" font-size="17" font-weight="850" letter-spacing="1.25">02 · JUDGE EVIDENCE</text>
      <text x="386" y="414" fill="#102c3c" font-family="Georgia, serif" font-size="20" font-weight="700">Aquarius supports up to</text>
      <text x="386" y="443" fill="#102c3c" font-family="Georgia, serif" font-size="20" font-weight="700">six crew with surface</text>
      <text x="386" y="472" fill="#102c3c" font-family="Georgia, serif" font-size="20" font-weight="700">power, air, and data.</text>
      <path d="M386 494H618" stroke="#b8d6d2"/>
      <text x="386" y="523" fill="#9b3f24" font-size="17" font-weight="800">SOURCE BOUNDARY</text>
      <text x="386" y="550" fill="#526b75" font-size="17">Not proof that a larger</text>
      <text x="386" y="574" fill="#526b75" font-size="17">habitat is independent.</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="654" y="323" width="280" height="264" rx="22" fill="#fbf8f1"/>
      <rect x="654" y="323" width="280" height="58" rx="22" fill="#d9eeea"/>
      <rect x="654" y="359" width="280" height="22" fill="#d9eeea"/>
      <text x="678" y="360" fill="#075b64" font-size="17" font-weight="850" letter-spacing="1.25">03 · DESIGN MOVE</text>
      <text x="678" y="416" fill="#102c3c" font-family="Georgia, serif" font-size="25" font-weight="700">Accept regular</text>
      <text x="678" y="447" fill="#102c3c" font-family="Georgia, serif" font-size="25" font-weight="700">deliveries.</text>
      <text x="678" y="487" fill="#526b75" font-size="18">Add a detachable service</text>
      <text x="678" y="514" fill="#526b75" font-size="18">module for air, power,</text>
      <text x="678" y="541" fill="#526b75" font-size="18">and resupply connections.</text>
      <rect x="678" y="553" width="126" height="23" rx="11.5" fill="#e8f4f2"/>
      <text x="741" y="570" text-anchor="middle" fill="#08747a" font-size="13" font-weight="800">SAME FINDING</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="946" y="323" width="280" height="264" rx="22" fill="url(#anchorFill)" stroke="#ec7650" stroke-width="4"/>
      <rect x="946" y="323" width="280" height="58" rx="20" fill="#ec7650"/>
      <rect x="948" y="359" width="276" height="22" fill="#ec7650"/>
      <text x="970" y="360" fill="#fffaf6" font-size="17" font-weight="900" letter-spacing="1.05">04 · CREATION ANCHOR</text>
      <text x="970" y="419" fill="#7f321f" font-size="16" font-weight="850" letter-spacing="1.3">EXACT PHRASE</text>
      <text x="970" y="466" fill="#7f321f" font-family="Georgia, serif" font-size="35" font-weight="700">regular</text>
      <text x="970" y="508" fill="#7f321f" font-family="Georgia, serif" font-size="35" font-weight="700">deliveries</text>
      <path d="M970 528H1202" stroke="#d58c72"/>
      <text x="970" y="556" fill="#6f5348" font-size="17">Repeated in design + creation.</text>
      <text x="970" y="578" fill="#9b3f24" font-size="14" font-weight="800">CONTINUITY · NOT GRADING</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1238" y="323" width="292" height="264" rx="22" fill="#fbf8f1"/>
      <rect x="1238" y="323" width="292" height="58" rx="22" fill="#d9eeea"/>
      <rect x="1238" y="359" width="292" height="22" fill="#d9eeea"/>
      <text x="1262" y="360" fill="#075b64" font-size="17" font-weight="850" letter-spacing="1.05">05 · REFLECT + BRANCH</text>
      <text x="1262" y="416" fill="#102c3c" font-family="Georgia, serif" font-size="25" font-weight="700">Name what changed.</text>
      <text x="1262" y="452" fill="#102c3c" font-family="Georgia, serif" font-size="25" font-weight="700">Keep uncertainty.</text>
      <text x="1262" y="488" fill="#102c3c" font-family="Georgia, serif" font-size="25" font-weight="700">Choose what is next.</text>
      <path d="M1262 514H1506" stroke="#b8d6d2"/>
      <text x="1262" y="544" fill="#526b75" font-size="17">One selected question unlocks</text>
      <text x="1262" y="569" fill="#526b75" font-size="17">the 9-node learning trace.</text>
    </g>

    <g transform="translate(70 626)" filter="url(#shadow)">
      <rect width="650" height="164" rx="22" fill="#082b3d" stroke="#3b7680" stroke-width="1.5"/>
      <text x="28" y="40" fill="#8fd1cc" font-size="16" font-weight="850" letter-spacing="1.6">LEARNER SAFEGUARDS</text>
      <g fill="#fbf8f1" font-size="20">
        <circle cx="35" cy="77" r="5" fill="#ec7650"/>
        <text x="52" y="84">No grades, accounts, profiles, or hidden score.</text>
        <circle cx="35" cy="115" r="5" fill="#ec7650"/>
        <text x="52" y="122">Source scope stays visible beside the finding.</text>
        <circle cx="35" cy="147" r="5" fill="#ec7650"/>
        <text x="52" y="154">AI proposes; the learner predicts, judges, and decides.</text>
      </g>
    </g>

    <g transform="translate(744 626)" filter="url(#shadow)">
      <rect width="786" height="164" rx="22" fill="#fbf8f1"/>
      <text x="30" y="40" fill="#9b3f24" font-size="16" font-weight="850" letter-spacing="1.6">ONE CONCRETE CODEX STORY</text>
      <text x="30" y="82" fill="#102c3c" font-family="Georgia, serif" font-size="27" font-weight="700">Codex turned a design principle into a testable chain.</text>
      <text x="30" y="117" fill="#526b75" font-size="19">Source boundary → design move → exact creation anchor → export.</text>
      <text x="30" y="146" fill="#08747a" font-size="18" font-weight="800">The proof fails closed when any link breaks.</text>
    </g>

    <text x="70" y="850" fill="#a8cfcb" font-size="17" font-weight="750" letter-spacing="1.25">39 CUES · 174 SECONDS · 9-NODE TRACE</text>
    <text x="1530" y="850" text-anchor="end" fill="#fbf8f1" font-size="18" font-weight="800">MAKE REASONING VISIBLE · KEEP HUMANS RESPONSIBLE</text>
  </g>
</svg>
